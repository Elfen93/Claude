<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog Finder</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --mute:#6b6a66; --line:#e3e1db; --acc:#1f4d3a; --accsoft:#e3efe8; --warn:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#201f1e; --ink:#eeeceb; --mute:#9d9a94; --line:#33312f; --acc:#7cc4a0; --accsoft:#22332b; --warn:#ff8a80; }
  }
  * { box-sizing:border-box; }
  body { margin:0 0 80px; font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
  input, select, button, textarea { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 9px; }
  button { cursor:pointer; } button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  @media (prefers-color-scheme: dark) { button.primary { color:#111; } }
  .mute { color:var(--mute); } .err { color:var(--warn); }
  .top { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  .top h1 { font-size:16px; margin:0; margin-right:auto; }
  .wrap { max-width:1500px; margin:0 auto; padding:0 16px; }
  .step { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:14px 0; }
  .step > h2 { font-size:14px; margin:0 0 10px; display:flex; gap:8px; align-items:center; }
  .num { background:var(--acc); color:#fff; border-radius:50%; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; }
  @media (prefers-color-scheme: dark) { .num { color:#111; } }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
  .row:last-child { margin-bottom:0; }
  #url { flex:1; min-width:260px; }
  #ask { width:100%; min-height:64px; font-size:15px; resize:vertical; }
  .chip { border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:3px 11px; font-size:13px; cursor:pointer; }
  .chip.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  @media (prefers-color-scheme: dark) { .chip.on { color:#111; } }
  .chip small { opacity:.7; }
  .lbl { color:var(--mute); font-size:12px; min-width:70px; }
  .reply { white-space:pre-line; background:var(--accsoft); border-radius:8px; padding:8px 12px; margin-top:8px; }
  details { margin-top:6px; } summary { cursor:pointer; color:var(--mute); }
  details .row { margin-top:8px; }
  label { display:flex; gap:6px; align-items:center; color:var(--mute); }
  #stats { display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; }
  #stats b { font-size:16px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; padding:4px 0 16px; }
  .card { position:relative; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .card.sel { outline:2px solid var(--acc); }
  .photo { position:relative; aspect-ratio:1; background:var(--line); display:flex; align-items:center; justify-content:center; cursor:zoom-in; }
  .photo img { width:100%; height:100%; object-fit:cover; display:block; }
  .photo .n { position:absolute; right:6px; bottom:6px; background:#000a; color:#fff; border-radius:10px; padding:1px 7px; font-size:11px; }
  .photo .none { color:var(--mute); font-size:12px; padding:8px; text-align:center; }
  .pick { position:absolute; left:8px; top:8px; z-index:2; width:22px; height:22px; cursor:pointer; accent-color:var(--acc); }
  .rank { position:absolute; right:8px; top:8px; z-index:2; background:#000b; color:#fff; border-radius:6px; padding:1px 7px; font-size:12px; font-weight:600; }
  .info { padding:10px 12px 12px; }
  .brand { font-weight:600; }
  .code { font-family:ui-monospace,monospace; font-size:12px; color:var(--mute); }
  .desc { margin-top:4px; font-size:13px; }
  .notes { margin-top:4px; font-size:12px; }
  .price { margin-top:6px; font-weight:600; font-size:15px; }
  #more { display:block; margin:0 auto 30px; }
  #bar { position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--card); border-top:1px solid var(--line); padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  #bar .sp { margin-right:auto; }
  #bar button.primary { padding:9px 18px; font-size:15px; }
  .overlay { position:fixed; inset:0; background:#0008; z-index:30; display:flex; align-items:center; justify-content:center; padding:16px; }
  .box { background:var(--card); border-radius:12px; padding:18px 20px; max-width:460px; }
  .box p { margin:0 0 14px; white-space:pre-line; }
  #seeSel { color:var(--acc); cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; }
  #lb { position:fixed; inset:0; background:#000d; display:none; z-index:20; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  #lb.on { display:flex; }
  #lb img { max-width:92vw; max-height:78vh; }
  #lb .thumbs { display:flex; gap:6px; max-width:92vw; overflow-x:auto; }
  #lb .thumbs img { height:64px; width:auto; max-width:none; border:2px solid transparent; cursor:pointer; }
  #lb .thumbs img.cur { border-color:#fff; }
  #lb .cap { color:#fff; }
</style>
</head>
<body>
<div class="top">
  <h1>Catalog Finder</h1>
  <span id="fx" class="mute"></span>
  <label title="Idioma / Language / Langue">🌐 <select id="langSel"></select></label>
  <label>Moneda <select id="outCurSel"></select></label>
  <label>Cliente <select id="profSel" title="Cada cliente tiene su margen, tarifa fija y moneda"></select></label>
  <button id="profEdit" title="Editar el cliente elegido o crear uno nuevo">✎ Margen</button>
</div>

<div class="wrap">
  <!-- 1 -->
  <div class="step" id="s1">
    <h2><span class="num">1</span> Carga tu hoja <span id="loaded" class="mute"></span></h2>
    <div id="loadBox">
      <div class="row">
        <input id="url" type="text" placeholder="Pega aquí el enlace CSV de Google Sheets (Archivo → Compartir → Publicar en la web → CSV)">
        <button class="primary" id="load">Cargar</button>
        <span class="mute">o sube el archivo</span>
        <input id="file" type="file" accept=".csv,.tsv,text/csv">
      </div>
    </div>
    <details id="settings">
      <summary>Ajustes avanzados (columnas, margen, fotos)</summary>
      <div class="row" id="mapping"></div>
      <div class="row">
        <label>URL foto (pantalla) <input id="tpl" type="text" style="min-width:380px"></label>
        <label>Tamaño <input id="size" type="text" style="width:80px"></label>
        <label>Prefijo código <input id="prefix" type="text" style="width:60px" placeholder="ej. C"></label>
        <label>Máx. fotos <input id="maxn" type="text" style="width:50px"></label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="natural" checked> Detailed grading en lenguaje natural</label>
        <label>URL foto (export) <input id="exp" type="text" style="min-width:380px"></label>
        <label>Etiquetas del rank (n=texto) <textarea id="labels" rows="3" style="width:200px"></textarea></label>
      </div>
    </details>
  </div>

  <!-- 2 -->
  <div class="step" id="s2" style="display:none">
    <h2><span class="num">2</span> ¿Qué buscas?</h2>
    <textarea id="ask" placeholder='Escríbelo como se lo dirías a una persona. Ej: "carteras Chanel o Hermès en estado A o mejor, entre $300 y $1500, elige 40 variadas"'></textarea>
    <div class="row" style="margin-top:8px">
      <button class="primary" id="askGo">Buscar</button>
      <button id="reset">Quitar todos los filtros</button>
      <button id="redo" style="display:none" title="Vuelve a pedirle a la IA que interprete la petición">↻ Reinterpretar con IA</button>
      <span id="aiState" class="mute"></span>
      <span id="keyBox"></span>
    </div>
    <div id="reply" class="reply" style="display:none"></div>

    <div style="margin-top:14px">
      <div class="row"><span class="lbl" id="priceLbl">Precio</span>
        <input id="pmin" type="text" placeholder="mín" style="width:80px"> – <input id="pmax" type="text" placeholder="máx" style="width:80px">
        <span id="pchips"></span></div>
      <div class="row"><span class="lbl">Estado</span><span id="gchips"></span>
        <select id="frank" title="Atajo: marca de golpe todos los grados desde SA hasta el elegido">
          <option value="0">atajo: "o mejor"…</option><option value="2">SA o mejor</option><option value="3">S o mejor</option><option value="4">A o mejor</option>
          <option value="5">AB o mejor</option><option value="6">B+ o mejor</option><option value="7">B o mejor</option><option value="8">B- o mejor</option><option value="9">BC o mejor</option>
        </select></div>
      <div class="row"><span class="lbl">Marcas</span><span id="bchips"></span>
        <input id="bAdd" list="bList" type="text" placeholder="otra marca…" style="width:150px"><datalist id="bList"></datalist></div>
      <div class="row" id="eRow"><span class="lbl">Entity</span><span id="echips"></span></div>
      <div class="row"><span class="lbl">Texto</span>
        <input id="q" type="text" placeholder="código, palabra… (ej. black, tote, lizard)" style="min-width:260px">
        <select id="sort"><option value="">Orden original</option><option value="brand">Marca</option><option value="pa">Precio ↑</option><option value="pd">Precio ↓</option></select>
        <label><input type="checkbox" id="onlyImg"> solo con fotos</label></div>
    </div>
  </div>

  <!-- 3 -->
  <div class="step" id="s3" style="display:none">
    <h2><span class="num">3</span> Elige</h2>
    <div id="stats"></div>
    <div class="row" style="margin-top:8px">
      <button id="selAll">Seleccionar todos los resultados</button>
      <label>o los primeros <input id="selN1" type="text" value="30" style="width:50px"></label>
      <button id="selFirst">Seleccionar</button>
      <label><input type="checkbox" id="selDiv"> variando marcas</label>
      <button id="selNone">Limpiar selección</button>
      <label><input type="checkbox" id="onlySel"> ver solo seleccionados</label>
    </div>
    <div id="status" class="mute"></div>
    <div id="grid" style="margin-top:10px"></div>
    <button id="more" style="display:none">Mostrar más</button>
  </div>
</div>

<div id="bar" style="display:none">
  <span class="sp"><b id="selN">0</b> seleccionados<span id="selView" class="mute"></span> · Buy Now <b id="bnMode"></b> · <button id="seeSel" title="Muestra solo los artículos seleccionados para revisarlos">ver solo seleccionados</button></span>
  <label title="Parte los artículos descargados en grupos">Dividir por <select id="splitBy"><option value="">— (una sola hoja)</option><option value="entity">Entity</option><option value="brand">Marca</option><option value="grade">Estado</option><option value="price">Rango de precio</option></select></label>
  <label id="splitOutL" style="display:none"><select id="splitOut"><option value="tabs">en pestañas (1 archivo)</option><option value="files">en archivos separados</option></select></label>
  <button id="exportCsv">CSV</button>
  <button id="exportX" class="primary">Descargar Excel (.xlsx)</button>
</div>
<div id="pdlg" class="overlay" style="display:none"><div class="box" style="min-width:340px">
  <p><b id="pTitle">Cliente</b></p>
  <div class="row"><label>Nombre <input id="pName" type="text" style="width:200px"></label></div>
  <div class="row"><label>Margen % <input id="pPct" type="text" style="width:70px"></label>
    <label>+ tarifa fija <input id="pFee" type="text" style="width:80px"></label><select id="pFeeCur"></select></div>
  <div class="row"><label>Moneda del cliente <select id="pOut"></select></label>
    <label>Redondear a <select id="pRound"><option value="0">no redondear</option><option value="1">1</option><option value="5">5</option><option value="10">10</option><option value="50">50</option><option value="100">100</option><option value="500">500</option><option value="1000">1000</option></select></label></div>
  <p class="mute" style="margin-bottom:10px">Precio final = precio de compra × (1 + margen %) + tarifa fija. <span id="pPreview"></span></p>
  <div class="row"><button class="primary" id="pSave">Guardar</button><button id="pDel">Eliminar</button><button id="pCancel">Cancelar</button></div>
</div></div>
<div id="dlg" class="overlay" style="display:none"><div class="box"><p id="dlgMsg"></p><div class="row" id="dlgBtns"></div></div></div>
<div id="lb"><div class="cap"></div><img><div class="thumbs"></div></div>

<script src="vendor/xlsx.bundle.js"></script>
<script src="i18n.js"></script>
<script>
/* ============ campos y utilidades ============ */
const FIELDS = {
  id:     { label:'Código (CTag)', alias:['ctag','c tag','c-tag','code','codigo','código','id','sku','item id','ref','reference'] },
  brand:  { label:'Marca',         alias:['brand name','brand','marca','marque'] },
  name:   { label:'Nombre',        alias:['item name','name','nombre','nom','designation'] },
  desc:   { label:'Descripción',   alias:['item description','description','descripcion','descripción'] },
  notes:  { label:'Notas',         alias:['public notes','notes','notas','remarques','notes publiques'] },
  grade:  { label:'Grading (si hay)', alias:['grading','grade','condition','estado','condicion','condición'] },
  price:  { label:'Precio',        alias:['price after tax','original price','price','precio','prix'] },
  cur:    { label:'Moneda',        alias:['currency','moneda','curr','devise'] },
  entity: { label:'Entity',        alias:['entity','entidad','entite','owner','seller','vendor','company'] },
};
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let lang = store.get('lang', 'es'); if (!window.LANGS[lang]) lang = 'es';
const LOC = () => ({ es: 'en-US', en: 'en-US', fr: 'fr-FR' }[lang]); // el español conserva el formato de siempre ($1,234)
const tl = (k, v) => { const s = lang === 'es' ? k : (window.I18N[k]?.[lang] ?? k); return v ? s.replace(/\{(\w+)\}/g, (m, x) => x in v ? v[x] : m) : s; };
const _fetch = window.fetch.bind(window); window.fetch = (u, o = {}) => _fetch(u, { ...o, headers: { ...(o.headers || {}), 'X-Lang': lang } });
const _tn = []; // textos y atributos estáticos del HTML, capturados al arrancar para poder retraducirlos
function captureI18n() {
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, { acceptNode: n => /\S/.test(n.nodeValue) && !['SCRIPT', 'STYLE'].includes(n.parentNode.nodeName) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  while (w.nextNode()) _tn.push({ n: w.currentNode, es: w.currentNode.nodeValue });
  document.querySelectorAll('[placeholder],[title]').forEach(el => ['placeholder', 'title'].forEach(a => { if (el.hasAttribute(a)) _tn.push({ el, a, es: el.getAttribute(a) }); }));
}
function applyI18n() {
  for (const x of _tn) {
    if (x.n) { if (!x.n.isConnected) continue; const m = x.es.match(/^(\s*)([\s\S]*?)(\s*)$/); x.n.nodeValue = m[1] + tl(m[2]) + m[3]; }
    else if (x.el.isConnected) x.el.setAttribute(x.a, tl(x.es));
  }
  document.documentElement.lang = lang;
}
const strip = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
let lastCatalog = null, rows = [], headers = [], map = {}, view = [], shown = 0, runId = 0;
const PAGE = 60, imgCache = new Map();
const get = (r, k) => map[k] ? (r[map[k]] || '') : '';
const cfg = () => ({ tpl: $('tpl').value.trim(), size: $('size').value.trim() || 'medium', prefix: $('prefix').value.trim(), maxn: Math.max(1, parseInt($('maxn').value) || 13) });
const code = r => { const v = (r[map.id] || '').trim(), p = cfg().prefix; return v && p && !v.toUpperCase().startsWith(p.toUpperCase()) ? p + v : v; };
const num = (k, d) => { const v = parseFloat(String($(k).value).replace(',', '.')); return isNaN(v) ? d : v; };
function setStatus(m, err) { $('status').textContent = m; $('status').className = err ? 'err' : 'mute'; }

/* ============ CSV ============ */
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0];
  const delim = [',', ';', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const out = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; if (row.some(x => x.trim())) out.push(row); row = []; }
    else f += c;
  }
  row.push(f); if (row.some(x => x.trim())) out.push(row);
  return out;
}

/* ============ grading → rank ============ */
const RANKS = [['SA WITH TAGS', 1, 'SA'], ['SA', 2, 'SA'], ['S', 3, 'S'], ['A', 4, 'A'], ['AB', 5, 'AB'], ['B+', 6, 'B+'], ['B', 7, 'B'], ['B-', 8, 'B-'], ['BC', 9, 'BC'], ['C', 10, 'C']];
const GRADE_RE = /GRADING:\s*(SA\s+with\s+tags|SA|S|AB|A|BC|B\+|B-|B|C)(?![A-Za-z])/i;
const GRADE_ONLY = /^(SA\s+with\s+tags|SA|S|AB|A|BC|B\+|B-|B|C)(?![A-Za-z])/i;
const rankEntry = key => RANKS.find(x => x[0] === key.toUpperCase().replace(/\s+/g, ' '));
function prep() { // precalcula por fila: texto de búsqueda, detalle de grading, rank
  for (const r of rows) {
    const vals = Object.entries(r).filter(([k]) => k[0] !== '_').map(([, v]) => v);
    r._detail = vals.find(v => /GRADING:/i.test(v)) || '';
    let m = r._detail.match(GRADE_RE) || (get(r, 'grade') || '').trim().match(GRADE_ONLY);
    r._rank = m ? rankEntry(m[1])[1] : 0;
    r._letter = m ? rankEntry(m[1])[2] : '';
    r._text = strip(vals.join(' ') + ' ' + code(r));
    r._core = strip([get(r, 'name'), get(r, 'desc')].filter(v => v && !/GRADING:/i.test(v)).join(' ')) || r._text;
  }
}
const rxCache = new Map();
const hit = (text, w) => { let re = rxCache.get(w); if (!re) rxCache.set(w, re = new RegExp('(^|[^a-z0-9])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + (/^\d+$/.test(w) ? '(?![0-9])' : ''))); return re.test(text); };
const nameOf = r => [get(r, 'name'), get(r, 'desc')].find(v => v && !/GRADING:/i.test(v)) || '';
const labels = () => { const o = {}; $('labels').value.split(/\n/).forEach(l => { const m = l.match(/^\s*(\d+)\s*=\s*(.+?)\s*$/); if (m) o[m[1]] = m[2]; }); return o; };
const rankText = r => r._rank ? `${r._rank} - ${r._letter} RANK` + (labels()[r._rank] ? ` (${labels()[r._rank]})` : '') : '';

/* ============ divisas → USD ============ */
let rates = null, ratesDate = '';
let profiles = JSON.parse(store.get('profiles', 'null') || 'null') || [{ name: 'Estándar', pct: parseFloat(store.get('pct', '35')) || 0, fee: parseFloat(store.get('fee', '2500')) || 0, feeCur: 'JPY', round: 0, outCur: 'USD' }];
let activeProf = store.get('profile', store.get('markupOn', '0') === '1' ? profiles[0].name : ''); // '' = sin margen
let outCur = store.get('outCur', 'USD');
const prof = () => profiles.find(p => p.name === activeProf) || null;
const rate = c => { c = String(c || 'USD').toUpperCase(); return c === 'USD' ? 1 : (rates && rates[c]) || 0; }; // unidades de cada moneda por 1 USD
const fromUSD = v => { const r = rate(outCur); return r ? v * r : NaN; };
const roundTo = (v, step) => step > 0 ? Math.round(v / step) * step : v;
const outVal = usd => { const p = prof(), v = fromUSD(usd); return roundTo(v, p ? +p.round || 0 : 0); };
const nice = v => { if (!isFinite(v) || v <= 0) return 0; const q = 10 ** (Math.floor(Math.log10(v)) - 1); return Math.round(v / q) * q; }; // 2 cifras significativas
const NODEC = ['JPY', 'KRW', 'VND', 'IDR', 'CLP', 'HUF'];
function fmtMoney(v, cur = outCur) {
  if (v == null || isNaN(v)) return '';
  try { return new Intl.NumberFormat(LOC(), { style: 'currency', currency: cur, currencyDisplay: 'narrowSymbol', maximumFractionDigits: NODEC.includes(cur) || Math.abs(v) >= 100 ? 0 : 2 }).format(v); }
  catch { return v.toLocaleString(LOC(), { maximumFractionDigits: 0 }) + ' ' + cur; }
}
const profLabel = () => { const p = prof(); return p ? `${p.name} (+${p.pct}%${p.fee ? ' + ' + p.fee.toLocaleString(LOC()) + ' ' + p.feeCur : ''})` : tl('sin margen'); };
const CUR_ALIAS = { '$': 'USD', 'US$': 'USD', '€': 'EUR', '£': 'GBP', '¥': 'JPY', '円': 'JPY', 'YEN': 'JPY', 'RMB': 'CNY', '元': 'CNY', 'CN¥': 'CNY', 'HK$': 'HKD' };
const curOf = r => { let c = get(r, 'cur').toUpperCase().replace(/\s/g, ''); if (!c) { const m = String(get(r, 'price')).match(/€|\$|£|¥|\b(?:eur|usd|gbp|jpy|cny)\b/i); c = m ? m[0].toUpperCase() : ''; } return CUR_ALIAS[c] || c; }; // sin columna de moneda: se toma del símbolo del precio (60€)
const priceNum = s => {

        const ents = [...new Set(rows.map(r => get(r, 'entity')).filter(Boolean))];
        const r = await fetch('/ai', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Catalog-Finder': '1' },
          body: JSON.stringify({ lang, query: text, brands: [...cnt].sort((a, b) => b[1] - a[1]).slice(0, 400).map(([b, n]) => `${b} (${n})`), entities: ents, total: rows.length }) });
        if (!r.ok) throw new Error(await r.text());

      } catch (e) { setStatus(tl('La IA falló ({e})', { e: e.message.slice(0, 160) }) + (multi ? '' : tl('. Uso el modo básico.')), true); if (multi) return; }
    }

/* ============ detailed grading en lenguaje natural ============ */
const NON_EN = /[^\x00-\x7F\u00C0-\u017F\u2018-\u201D\u2013\u2014\u00B0\u00BD]/;
function plainDescribe(text) { // respaldo sin IA: reglas simples sobre el texto estructurado
  const L = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  let grade = '', size = '', cur = '', odor = ''; const ext = [], int = [], add = [], col = [];
  const put = (list, v) => v && list.push(v.replace(/\s+/g, ' ').trim());
  for (const l of L) {
    let m;
    if (NON_EN.test(l)) continue; // el respaldo no puede traducir: descarta cualquier línea en otro alfabeto
    if ((m = l.match(/^(?:item\s+)?grading\s*:\s*(.*)$/i))) { grade = (m[1].match(/^(SA\s+with\s+tags|SA|S|AB|A|BC|B\+|B-|B|C)(?![A-Za-z])/i) || [''])[0].toUpperCase(); cur = ''; }
    else if ((m = l.match(/^exterior(?:\s+(?:quality|condition))?\s*[:\-]\s*(.*)$/i))) { cur = 'e'; put(ext, m[1]); }
    else if ((m = l.match(/^interior(?:\s+(?:quality|condition))?\s*[:\-]\s*(.*)$/i))) { cur = 'i'; put(int, m[1]); }
    else if ((m = l.match(/^add-?ons?(?:\(s\))?\s*[:\-]\s*(.*)$/i))) { cur = 'a'; put(add, m[1]); }
    else if ((m = l.match(/^colou?rs?(?:\(s\))?\s*[:\-]\s*(.*)$/i))) { cur = 'c'; put(col, m[1]); }
    else if ((m = l.match(/^odou?r\s*[:\-]\s*(.*)$/i))) { cur = 'o'; odor = m[1].trim(); }
    else if (/^item\s+quality\s*[:\-]?\s*$/i.test(l)) cur = '';
    else if (/^[A-Za-z][A-Za-z0-9 ()\/&'.-]{1,40}:/.test(l)) cur = 'x'; // cualquier otro apartado (additional info, notes...): se ignora
    else if ((m = l.match(/^(\d+(?:\.\d+)?)\s*(?:"|”|''|in\b|inch)/i))) size = m[1];
    else if (cur === 'e') put(ext, l); else if (cur === 'i') put(int, l); else if (cur === 'a') put(add, l); else if (cur === 'c' && /^[A-Za-z][A-Za-z\/ &-]{1,24}$/.test(l)) put(col, l);
    else if (cur === 'o' && !col.length && /^[A-Za-z][A-Za-z\/ &-]{1,30}$/.test(l)) put(col, l);
  }
  const lc = a => a.map(x => x.toLowerCase());
  const altRe = /re-?\s?paint|re-?\s?dy/i, alt = [...ext, ...int].some(x => altRe.test(x));
  const clean = a => lc(a.filter(x => !altRe.test(x))).join(', ');
  const e = clean(ext), i = clean(int);
  let wear = '';
  if (e && e === i) wear = /throughout/.test(e) ? `${e.replace(/\s*throughout\s*/, ' throughout')} both the interior and exterior` : `${e} on both the interior and exterior`;
  else if (e && i) wear = `${e} on the exterior and ${i} on the interior`;
  else if (e || i) wear = `${e || i} on the ${e ? 'exterior' : 'interior'}`;
  const join = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
  const items = lc(add).filter(Boolean); if (items.includes('key') && items.includes('lock')) { items.splice(items.indexOf('key'), 1); items[items.indexOf('lock')] = 'lock and key'; }
  let out = `This ${col.length ? lc(col).join('/') + ' ' : ''}${size ? 'size ' + size + ' ' : ''}item${grade ? ` is in Grade ${grade} condition` : ' is in the condition described'}`;
  out += (wear ? `, showing ${wear}` : '') + (alt ? `${wear ? ', and' : ', and'} has been repainted or re-dyed` : '') + '.';
  if (odor) out += ` ${/^no\b/i.test(odor) ? 'It has no noticeable odor.' : 'Odor: ' + odor.toLowerCase() + '.'}`;
  if (items.length) out += ` It comes complete with its ${items.length > 1 && !items.includes('lock and key') ? join(items) : join(items)}.`;
  return out;
}
async function describeRows(sel, urls) { // → { text: Map(texto→descripción), photo: Map(fila→descripción), st }
  const st = { ai: 0, rules: 0, photo: 0, empty: 0 }, text = new Map(), photo = new Map();
  const uniq = [...new Set(sel.map(r => r._detail).filter(Boolean))];
  const prow = []; sel.forEach((r, i) => { if (!r._detail && urls[i].length) prow.push({ r, i }); });
  const post = async body => { const r = await fetch('/describe', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Catalog-Finder': '1' }, body: JSON.stringify(body) }); if (!r.ok) throw new Error(await r.text()); return r.json(); };
  if (aiOn) {
    const jobs = []; for (let i = 0; i < uniq.length; i += 20) jobs.push({ t: uniq.slice(i, i + 20) });
    for (let i = 0; i < prow.length; i += 4) jobs.push({ p: prow.slice(i, i + 4) });
    let done = 0;
    await pool(jobs, async j => {
      try {
        if (j.t) { const { descs } = await post({ items: j.t.map((t, k) => ({ k, text: t })) }); j.t.forEach((t, k) => { if (descs[k] && !NON_EN.test(descs[k])) { text.set(t, descs[k]); st.ai++; } }); }
        else { const { descs } = await post({ photoItems: j.p.map(({ r, i }, k) => ({ k, brand: get(r, 'brand'), name: nameOf(r), grade: r._letter, notes: get(r, 'notes'), photos: urls[i] })) });
          j.p.forEach(({ r }, k) => { if (descs[k] && !NON_EN.test(descs[k])) { photo.set(r, descs[k]); st.photo++; } }); }
      } catch (e) { /* esos artículos usarán el respaldo */ }
      setStatus(tl('Redactando descripciones… {a}/{b}', { a: ++done, b: jobs.length }));
    }, 3);
  }
  uniq.forEach(t => { if (!text.has(t)) { text.set(t, plainDescribe(t)); st.rules++; } });
  st.empty = sel.filter(r => !r._detail && !photo.has(r)).length;
  return { text, photo, st };
}

/* ============ export customer ============ */
const NPIC = 13;
const photoUrl = (id, n) => $('exp').value.trim().replace('{id}', id).replace('{n}', n);
function ask(msg, buttons) { // → valor del botón pulsado (o null)
  return new Promise(res => {
    $('dlgMsg').textContent = msg; const box = $('dlgBtns'); box.innerHTML = '';
    buttons.forEach(([label, val, primary]) => { const b = document.createElement('button'); b.textContent = label; if (primary) b.className = 'primary'; b.onclick = () => { $('dlg').style.display = 'none'; res(val); }; box.append(b); });
    $('dlg').style.display = '';
  });
}
async function chooseScope() { // qué artículos se descargan: lo dejo siempre claro antes de generar el archivo
  const { inView, hidden } = selCounts(), n = selected.size, nv = view.filter(r => code(r)).length;
  if (n && !hidden) return 'all';
  if (!n) {
    if (!nv) { setStatus(tl('No hay nada que descargar: ni seleccionados ni resultados'), true); return null; }
    return ask(tl('No has seleccionado nada.\n¿Descargo los {n} resultados que ves ahora?', { n: nv.toLocaleString(LOC()) }) + (nv > 300 ? tl('\n(Son muchos: tardará bastante en buscar fotos y redactar.)') : ''), [[tl('Sí, descargar los {n}', { n: nv.toLocaleString(LOC()) }), 'viewAll', true], [tl('Cancelar'), null]]);
  }
  const opts = [[tl('Los {n} seleccionados', { n }), 'all', true]];
  if (inView) opts.push([tl('Solo los {n} seleccionados que veo', { n: inView }), 'view']);
  opts.push([tl('Cancelar'), null]);
  return ask(tl('Tienes {n} artículos seleccionados, pero con los filtros actuales solo ves {v} de ellos ({h} quedan fuera de la vista).\n¿Qué descargo?', { n, v: inView, h: hidden }), opts);
}
async function buildCustomer(scope = 'all') {
  if (scope !== 'viewAll' && !selected.size) throw new Error(tl('Selecciona artículos primero'));
  if (!rates) throw new Error(tl('No hay tipos de cambio; no se pueden calcular los precios'));
  let sel; const urls = []; let done = 0;
  if (scope === 'viewAll') sel = view.filter(r => code(r));
  else { sel = rows.filter(r => selected.has(code(r))); if (scope === 'view') { const vs = new Set(view); sel = sel.filter(r => vs.has(r)); } sel.sort((a, b) => (a._ord ?? 1e9) - (b._ord ?? 1e9)); }
  await pool(sel, async (r, i) => { urls[i] = code(r) ? await findImages(code(r)) : []; if (++done % 10 === 0) setStatus(tl('Buscando fotos… {a}/{b}', { a: done, b: sel.length })); });
  const nat = $('natural').checked, D = nat ? await describeRows(sel, urls) : null;
  const head = ['BRAND', 'SKU', 'ITEM NAME', 'DETAILED GRADING', 'GRADING (RANK)', 'Purchase?', 'Buy Now Price', 'Picture #1'];
  for (let n = 2; n <= NPIC; n++) head.push('Picture #' + n);
  for (let n = 1; n <= NPIC; n++) head.push(String(n));
  let nopic = 0, noid = 0, noprice = 0;
  const body = sel.map((r, i) => {
    const id = code(r), have = Math.min(urls[i].length, NPIC), price = finalOf(r);
    if (!id) noid++; else if (!have) nopic++; if (isNaN(price)) noprice++;
    const pic = n => n <= have ? { f: `image("${photoUrl(id, n)}",4,100,100)` } : {};
    const row = [{ v: get(r, 'brand') }, { v: id }, { v: nameOf(r) }, (nat && D.photo.has(r)) ? { v: D.photo.get(r), photo: 1 } : { v: nat && r._detail ? D.text.get(r._detail) : r._detail }, { v: rankText(r) }, {}, isNaN(price) ? {} : { v: Math.round(outVal(price) * 100) / 100, money: 1 }, pic(1)];
    for (let n = 2; n <= NPIC; n++) row.push(pic(n));
    for (let n = 1; n <= NPIC; n++) row.push(n <= have ? { f: `iferror(HYPERLINK("${photoUrl(id, n)}","${id} - photo${n}"))` } : {});
    return row;
  });
  const w = [nat && D.st.rules && tl('{n} descripciones con redacción básica (sin IA; el texto en otros idiomas se descarta)', { n: D.st.rules }), nat && D.st.photo && tl('{n} descripciones hechas SOLO desde las fotos (celdas naranjas): revísalas', { n: D.st.photo }), nat && D.st.empty && tl('{n} sin descripción (sin notas{x})', { n: D.st.empty, x: aiOn ? tl(' ni fotos') : tl(' y sin IA para leer las fotos') }), noid && tl('{n} sin CTag', { n: noid }), nopic && tl('{n} sin fotos', { n: nopic }), noprice && tl('{n} sin precio USD', { n: noprice })].filter(Boolean);
  return { head, body, sel, warn: w.join(', ') };
}
const stamp = () => new Date().toISOString().slice(0, 10);
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }
async function exportCsv() {
  try {
    const scope = await chooseScope(); if (!scope) return;
    const { head, body, warn } = await buildCustomer(scope), q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const lines = [head.map(q).join(',')].concat(body.map(r => r.map(c => q(c.f ? '=' + c.f : c.v ?? '')).join(',')));
    download(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv' }), `customer_${stamp()}.csv`);
    done(body.length, warn);
  } catch (e) { setStatus(e.message, true); }
}
const priceBands = () => { const e = bandEdges(), L = [[0, e[0], `Under ${e[0]}`], [e[0], e[1], `${e[0]}-${e[1]}`], [e[1], e[2], `${e[1]}-${e[2]}`], [e[2], e[3], `${e[2]}-${e[3]}`], [e[3], Infinity, `Over ${e[3]}`]]; return L.map(x => [x[0], x[1], x[2] + ' ' + outCur]); };
const SPLITS = { // → [etiqueta, orden]
  entity: r => [get(r, 'entity') || '(no entity)', get(r, 'entity') || '~'],
  brand: r => [get(r, 'brand') || '(no brand)', strip(get(r, 'brand')) || '~'],
  grade: r => [r._rank ? `Grade ${r._letter}` : '(no grade)', String(r._rank || 99).padStart(2, '0')],
  price: r => { const B = priceBands(), p = fromUSD(finalOf(r)), i = B.findIndex(([lo, hi]) => p >= lo && p < hi); return i < 0 ? ['(no price)', '9'] : [B[i][2], String(i)]; },
};
const SYMS = { USD: '$', EUR: '€', GBP: '£', JPY: '¥', CNY: 'CN¥', HKD: 'HK$', CAD: 'C$', AUD: 'A$', SGD: 'S$', KRW: '₩', CHF: 'CHF ' };
const moneyFmt = () => SYMS[outCur] ? `"${SYMS[outCur]}"#,##0` : `#,##0 "${outCur}"`;
function buildSheet(head, body) {
  const ws = {}, thin = { style: 'thin', color: { rgb: 'BFBFBF' } }, border = { top: thin, bottom: thin, left: thin, right: thin };
  const H = rgb => ({ font: { bold: true, sz: 10 }, fill: { patternType: 'solid', fgColor: { rgb } }, alignment: { horizontal: 'center', vertical: 'center', wrapText: true }, border });
  const B = { alignment: { horizontal: 'center', vertical: 'center', wrapText: true }, border }, BL = { alignment: { horizontal: 'left', vertical: 'center', wrapText: true }, border };
  head.forEach((h, c) => { ws[XLSX.utils.encode_cell({ r: 0, c })] = { t: 's', v: h, s: H(h === 'Purchase?' ? 'B6D7A8' : 'FFF2CC') }; });
  body.forEach((row, i) => row.forEach((cell, c) => {
    const a = XLSX.utils.encode_cell({ r: i + 1, c });
    if (cell.f) ws[a] = { t: 's', v: '', f: cell.f, s: B };
    else if (cell.money) ws[a] = { t: 'n', v: cell.v, z: moneyFmt(), s: { ...B, font: { sz: 12 } } };
    else if (cell.v !== undefined && cell.v !== '') ws[a] = { t: 's', v: String(cell.v), s: cell.photo ? { ...BL, fill: { patternType: 'solid', fgColor: { rgb: 'FFE699' } } } : c === 3 ? BL : B };
    else ws[a] = { t: 's', v: '', s: B };
  }));
  ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: body.length, c: head.length - 1 } });
  ws['!cols'] = head.map((h, c) => ({ wch: [16, 12, 30, 46, 24, 11, 14][c] || (c < 7 + 13 ? 15 : 19) }));
  ws['!rows'] = [{ hpx: 34 }].concat(body.map(() => ({ hpx: 105 })));
  ws['!autofilter'] = { ref: ws['!ref'] };
  return ws;
}
async function exportXlsx() {
  if (typeof XLSX === 'undefined') return setStatus(tl('No se cargó la librería xlsx (falta vendor/xlsx.bundle.js). Usa el botón CSV.'), true);
  try {
    const scope = await chooseScope(); if (!scope) return;
    const { head, body, sel, warn } = await buildCustomer(scope), by = $('splitBy').value;
    if (!by) { const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, buildSheet(head, body), 'Customer'); XLSX.writeFile(wb, `customer_${stamp()}.xlsx`); return done(body.length, warn); }
    const groups = new Map(); // etiqueta → { ord, idx[] }
    sel.forEach((r, i) => { const [label, ord] = SPLITS[by](r); if (!groups.has(label)) groups.set(label, { ord, idx: [] }); groups.get(label).idx.push(i); });
    const list = [...groups].sort((a, b) => a[1].ord.localeCompare(b[1].ord)), used = new Set();
    const nameOf_ = label => { let n = label.replace(/[:\\\/?*\[\]]/g, '-').slice(0, 28) || 'Sheet', k = 1, base = n; while (used.has(n.toLowerCase())) n = `${base.slice(0, 25)}_${++k}`; used.add(n.toLowerCase()); return n; };
    if ($('splitOut').value === 'files') {
      for (const [label, g] of list) { const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, buildSheet(head, g.idx.map(i => body[i])), nameOf_(label)); XLSX.writeFile(wb, `customer_${by}_${nameOf_(label).replace(/\s+/g, '_')}_${stamp()}.xlsx`); await new Promise(r => setTimeout(r, 400)); }
    } else {
      const wb = XLSX.utils.book_new(); for (const [label, g] of list) XLSX.utils.book_append_sheet(wb, buildSheet(head, g.idx.map(i => body[i])), nameOf_(label));
      XLSX.writeFile(wb, `customer_por_${by}_${stamp()}.xlsx`);
    }
    done(body.length, warn, tl(' · {n} grupos ({g})', { n: list.length, g: list.map(([l, g]) => `${l}: ${g.idx.length}`).join(', ') }));
  } catch (e) { setStatus(e.message, true); }
}
function done(n, warn, extra = '') { setStatus(tl('Descargados {n} artículos · Buy Now en {c} · {m}{x}', { n, c: outCur, m: prof() ? tl('margen {p}', { p: profLabel() }) : tl('sin margen'), x: extra }) + (warn ? ' · ⚠ ' + warn : ''), !!warn); }
$('splitBy').onchange = () => { $('splitOutL').style.display = $('splitBy').value ? '' : 'none'; };
$('exportX').onclick = exportXlsx; $('exportCsv').onclick = exportCsv;
